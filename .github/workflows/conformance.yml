name: XPO conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/conformance.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/capsule-conformance.mjs
      - run: node tests/address-conformance.mjs
      - run: node tests/semantic-conformance.mjs
      - run: node tests/journal-conformance.mjs
      - run: node tests/authority-conformance.mjs
      - run: node tests/topology-conformance.mjs
